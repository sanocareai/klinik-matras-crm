# Pintu masuk STAGING (satu-satunya kontainer dengan akses ke luar jaringan internal). Hanya meneruskan ke backend-staging.
server {
  listen 80;
  server_name _;
  client_max_body_size 60m;
  access_log /var/log/nginx/access.log;  # log akses AKTIF (docker logs edge-staging) — dasar audit siapa mengakses staging latihan
  error_log  /var/log/nginx/error.log warn;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Environment "staging (QA-PV2) - bukan production" always;
  location / {
    proxy_pass http://backend-staging:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
